apiVersion: v1
kind: Namespace
metadata:
  name: e2e-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: e2e-test
  labels:
    app: echo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: ealen/echo-server:0.9.0
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: echo-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: echo-data
  namespace: e2e-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard       # kind 内置 SC 名（不是 local-path）
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: e2e-test
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: e2e-test
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: echo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80