# ArgoCD deployer：让 argocd application-controller 服务账号能在 monitoring ns 管资源
# （ArgoCD 默认 default project 只对部分 ns 有权；显式赋权避免 sync Forbidden）
# Phase F Task 1（M11 前置）：手动 apply（非 GitOps——ArgoCD 需先有此权限才能 sync 进 monitoring ns，鸡生蛋）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-deployer
  namespace: monitoring
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "alertmanagerconfigs"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-deployer
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller   # 实查确认（kubectl -n argocd get sa）
    namespace: argocd
roleRef:
  kind: Role
  name: argocd-deployer
  apiGroup: rbac.authorization.k8s.io
