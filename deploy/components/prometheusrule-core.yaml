apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: core-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack   # 双重保险：ruleSelectorNilUsesHelmValues=false 选所有；带 label 也兼容
    app.kubernetes.io/name: core-rules
spec:
  groups:
    # === 节点层 ===
    - name: kubernetes-node.rules
      rules:
        # ★ 验收门规则：单 worker NotReady for:5m → warning（AC-US1-01 前半）
        # ⚠️ PromQL 修正：role label 在 kube_node_labels{label_role}（KSM v2.19.1，不在 kube_node_status_condition），
        #    故用 * on(node) group_left(label_role) join（Task 1 预演核实，plan 原文 role="worker" 直接写法失效）
        - alert: KubeWorkerNodeNotReady
          expr: |
            (kube_node_status_condition{condition="Ready",status!="true"} == 1)
              * on(node) group_left(label_role)
              kube_node_labels{label_role="worker"}
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: "https://raw.githubusercontent.com/jy2382726/k8s-monitor/main/docs/runbook/not-ready.md"
            summary: "Worker 节点 {{ $labels.node }} NotReady"
            description: "Worker 节点 {{ $labels.node }} 已连续 5m 处于 NotReady。排查：kubectl describe node {{ $labels.node }}"
        - alert: KubeMasterNodeNotReady
          expr: |
            (kube_node_status_condition{condition="Ready",status!="true"} == 1)
              * on(node) group_left(label_role)
              kube_node_labels{label_role="control-plane"}
          labels:
            severity: critical
          annotations:
            runbook_url: "https://raw.githubusercontent.com/jy2382726/k8s-monitor/main/docs/runbook/control-plane.md"
            summary: "Master 节点 {{ $labels.node }} NotReady"
            description: "控制面节点 NotReady，集群级风险。kubectl describe node {{ $labels.node }}"
        - alert: MultipleWorkerNodesNotReady
          expr: |
            count(
              (kube_node_status_condition{condition="Ready",status!="true"} == 1)
                * on(node) group_left(label_role)
                kube_node_labels{label_role="worker"}
            ) >= 2
          labels:
            severity: critical
          annotations:
            runbook_url: "https://raw.githubusercontent.com/jy2382726/k8s-monitor/main/docs/runbook/not-ready.md"
            summary: "2+ worker 节点同时 NotReady"
            description: "多 worker 节点同时失联，集群容量告急。"
        - alert: KubeNodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: "https://raw.githubusercontent.com/jy2382726/k8s-monitor/main/docs/runbook/not-ready.md"
            summary: "节点 {{ $labels.node }} 磁盘压力"
            description: "kubelet 报 DiskPressure。排查：kubectl describe node {{ $labels.node }}；节点上 docker system df / df -h 看占用，清理镜像/日志/emptyDir。"
        - alert: KubeNodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: "https://raw.githubusercontent.com/jy2382726/k8s-monitor/main/docs/runbook/not-ready.md"
            summary: "节点 {{ $labels.node }} 内存压力"
            description: "kubelet 报 MemoryPressure。排查：kubectl describe node {{ $labels.node }} 看 allocatable；kubectl top pod -A --sort-by=memory 找内存大户。"
    # === Pod / 容器层 ===
    - name: kubernetes-pod.rules
      rules:
        - alert: KubePodCrashLooping
          # +node join：让 Pod 症状告警带 node label，供 06 §3.4 inhibit equal:[node] 抑制（AC-US5）
          expr: |
            (max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1)
            * on(namespace, pod) group_left(node) kube_pod_info
          for: 10m
          labels:
            severity: info
          annotations:
            runbook_url: "https://raw.githubusercontent.com/jy2382726/k8s-monitor/main/docs/runbook/crashloop.md"
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} CrashLoopBackOff"
            description: "容器 {{ $labels.container }} 持续崩溃重启。kubectl logs {{ $labels.pod }} -n {{ $labels.namespace }} --previous"
        - alert: KubePodNotReady
          expr: sum by (namespace, pod) (max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"} == 1))
          for: 10m
          labels:
            severity: info
          annotations:
            runbook_url: "https://raw.githubusercontent.com/jy2382726/k8s-monitor/main/docs/runbook/pod-pending.md"
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 长期 Pending/Unknown"
            description: "Pod 长期未 Running。排查：kubectl describe pod {{ $labels.pod }} -n {{ $labels.namespace }}；kubectl get events -n {{ $labels.namespace }} --sort-by=.lastTimestamp。"
        - alert: KubeContainerOOMKilled
          # +node join：同上，供 inhibit equal:[node]
          expr: |
            (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
            * on(namespace, pod) group_left(node) kube_pod_info
          for: 1m
          labels:
            severity: info
          annotations:
            runbook_url: "https://raw.githubusercontent.com/jy2382726/k8s-monitor/main/docs/runbook/oom.md"
            summary: "容器 {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} OOMKilled"
            description: "容器被 OOM 终止，检查内存 limit / 内存泄漏。"
    # === 工作负载 ===
    - name: kubernetes-workload.rules
      rules:
        - alert: KubeDeploymentReplicasMismatch
          expr: |
            (kube_deployment_status_replicas_available != kube_deployment_spec_replicas)
            and
            changes(kube_deployment_status_replicas_updated[10m]) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: "https://raw.githubusercontent.com/jy2382726/k8s-monitor/main/docs/runbook/crashloop.md"
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} 副本不足"
            description: "可用副本与期望不符且 10m 未变化（排除滚动更新中）。"
