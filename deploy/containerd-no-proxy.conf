# containerd systemd drop-in: 让节点内的 containerd 拉镜像时绕过 HTTP 代理.
#
# 背景: 宿主机 /etc/systemd/system/docker.service.d/http-proxy.conf 给 docker 守护进程
# 设了 HTTP_PROXY=http://127.0.0.1:7890 (本机 Clash), docker 会把它透传进每个容器.
# 但容器里的 127.0.0.1 指向容器自身而非宿主机, 代理不可达 ->
# 节点内 containerd 拉任何镜像都会失败 (proxyconnect ... connection refused).
#
# 因为镜像已经走上面的 daocloud 国内加速 (直连可达, 本就不需要代理),
# 所以这里用 NO_PROXY=* 让 containerd 对所有地址直连. zz- 前缀保证它最后加载、覆盖前面同名变量.
#
# 通过 kind-config.yaml 的 extraMounts 把本文件挂载到
# /etc/systemd/system/containerd.service.d/zz-no-proxy.conf, systemd 启动 containerd 时自动生效.

[Service]
Environment="NO_PROXY=*"
Environment="no_proxy=*"
