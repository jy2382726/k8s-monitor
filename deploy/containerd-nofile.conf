# containerd systemd drop-in: 提高节点 fd ulimit（修复 kind 节点 fd 顽疾）
# ----------------------------------------------------------------------------
# 背景: kind 节点镜像默认进程级 fd soft ulimit=1024（hard=1048576）。过低的 soft limit
#   会让 fd 消耗大的进程 crashloop（"too many open files"）:
#     - kube-proxy（维护每 service 一条 iptables 规则，规则多 → fd 大户）
#     - alertmanager（cluster gossip + notification pool）→ 启动 bind socket 失败 exit 2
#   连锁后果（开机后尤其严重）: wsl shutdown → worker iptables 重置 → kube-proxy 本该重新
#     配 iptables，但 fd crashloop 配不了 → worker pod 连不上 apiserver(10.96.0.1)
#     → argocd-server 等 CrashLoop → recover.sh 卡在 L79 等 kube-proxy Ready（CLAUDE.md §7）。
#
# 此 drop-in 把 containerd 的 LimitNOFILE 提到 65536。
#   ✅ 生效对象: 普通业务 pod（alertmanager / argocd-server / prometheus 等）——它们继承
#      containerd 进程的 ulimit，提到 65536 后不再 fd crashloop（实测 alertmanager ulimit=65536）。
#   ⚠️ 不生效对象: kube-proxy（hostNetwork+privileged，走不同容器创建路径，不继承 containerd
#      ulimit，仍 1024 crashloop）。这属可接受噪声——开机后 recover L1 restart 一次 kube-proxy
#      让它启动时配一次 iptables 即足够恢复 worker 网络（见 recover.sh L1 + 特判）。
#
# 部署: 通过 kind-config.yaml 的 extraMounts 把本文件挂载到
#       /etc/systemd/system/containerd.service.d/zz-nofile.conf，systemd 启动 containerd 时自动生效。
#       zz- 前缀保证它最后加载、覆盖默认 LimitNOFILE。
# 注意: 仅在 `kind create cluster` 时挂载生效；已存在的集群要手动 docker exec 写同内容 drop-in
#       + systemctl restart containerd（临时，节点重启丢失）。
# ----------------------------------------------------------------------------

[Service]
LimitNOFILE=65536
