# ============================================================
# 钉钉机器人凭据 — 示例模板（占位，可入 Git）
# ============================================================
# ⚠️ 真实值绝不入 Git（CLAUDE.md §10）。本文件只放 <FILL_ME> 占位。
#
# 真实值的两个存放点（都不在 Git）：
#   1. 集群 K8s Secret（权威）：
#        monitoring/dingtalk-credentials-main       主告警群
#        monitoring/dingtalk-credentials-watchdog   监控健康群
#   2. 本机找回备份（已 gitignore）：deploy/.secrets/dingtalk-credentials.yaml
#
# 从零创建 Secret（把 <FILL_ME> 换成钉钉机器人真实值）：
#   kubectl -n monitoring create secret generic dingtalk-credentials-main \
#     --from-literal=access_token='<FILL_ME>' \
#     --from-literal=secret='<FILL_ME>'
#   kubectl -n monitoring create secret generic dingtalk-credentials-watchdog \
#     --from-literal=access_token='<FILL_ME>' \
#     --from-literal=secret='<FILL_ME>'
#
# 钉钉端获取真实值：群 → 设置 → 智能群助手 → 机器人
#   access_token = webhook URL 里 ?access_token= 之后那串
#   secret       = 「安全设置 → 加签」里复制的密钥
#
# 消费方：deploy/verify/assemble-webhook-config.sh 从这两个 Secret
#        base64 -d 读值，envsubst 进 prometheus-webhook-dingtalk 的 config。
# ============================================================

main-group:                    # 主告警群机器人（收 P0 critical + P1 warning）
  access_token: "<FILL_ME>"    # webhook 的 access_token
  secret:       "<FILL_ME>"    # 加签密钥

watchdog-group:                # 监控健康群机器人（收 Watchdog 心跳）
  access_token: "<FILL_ME>"    # webhook 的 access_token
  secret:       "<FILL_ME>"    # 加签密钥
