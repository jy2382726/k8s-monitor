# ArgoCD Helm chart values
# 文档: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd

server:
  service:
    type: NodePort
    nodePort: 30080
  ingress:
    enabled: true
    ingressClassName: nginx
    # ★ chart v10.1.2 认的字段是 `hostname`（单值字符串），不是 `hosts`（列表）。
    # 旧版用 hosts[].host 列表写法，chart 会静默忽略、回退默认 argocd.example.com → Ingress host 不匹配 → 浏览器 404。
    # 实测确认（helm template）：只有 hostname 字段能渲染进 .spec.rules[].host。
    hostname: argocd.local
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

configs:
  cm:
    application.instanceLabelKey: argocd.argoproj.io/instance
  # admin 密码：不在 values 里写死（错误的 bcrypt 占位会让 ArgoCD 跳过自动生成、反而锁死登录）。
  # 让 chart 自动生成随机密码，安装后用以下命令取：
  #   kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
  params:
    server.insecure: "true"   # ★ 开发环境让 argocd-server 走 HTTP，SSL 在 ingress-nginx 终止。
                              # 否则 argocd 默认 HTTPS(443)，经 http Ingress 访问会被 307 重定向到 https → 浏览器失败。
                              # 见 chart 安装提示的 "Option 2: terminate SSL at your ingress"。

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

applicationSet:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

notifications:
  enabled: false                        # 开发环境关闭

dex:
  enabled: false                        # 开发环境无 SSO，关掉免拉 ghcr.io/dexidp/dex（节点无 mirror + 未预灌 → ImagePullBackOff）

redis:
  image:
    repository: docker.io/library/redis # ★ 默认 ecr-public.aws.com/docker/library/redis，节点 certs.d 无此 mirror → 改走 docker.io mirror
    tag: 8.2.3-alpine                   # chart 10.1.2 默认；8.x 才是开源版 Redis（7.4.x 非开源，已弃）
  resources:
    requests:
      cpu: 50m
      memory: 64Mi