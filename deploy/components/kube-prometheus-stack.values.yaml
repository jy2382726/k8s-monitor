# kube-prometheus-stack Helm chart values
# 文档: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

# 关闭 alertmanager（开发环境）
alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    # 启用 ServiceMonitor 自动发现
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 100Mi

grafana:
  adminPassword: "admin123"           # ★ 仅开发环境，生产请改
  service:
    type: NodePort
    nodePort: 30030
  ingress:
    enabled: true
    ingressClassName: nginx
    # ★ grafana subchart (chart 12.7.1) 的 hosts 是「字符串列表」，元素直接是 host 名（不是 {host: xxx} 对象）。
    # 实测确认（helm template）：hosts[0]=grafana.local 能正确渲染进 .spec.rules[].host。
    hosts:
      - grafana.local
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard       # ★ kind 内置 local-path 的 SC 名叫 standard（provisioner=rancher.io/local-path），不是 local-path
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 32Mi

kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 32Mi